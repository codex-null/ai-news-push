name: AI 资讯每日推送
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python3 ai_news_push.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
